ext {
    minSdkVersion = 15
    compileSdkVersion = 29
    targetSdkVersion = 29
    buildToolsVersion = "29.0.0"
}

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
