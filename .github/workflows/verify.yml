name: Verify source candidate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  layout-and-hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python tools/check_publication.py
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - run: python Sources/tools/source_layout.py verify
      - run: python -m unittest discover -s Sources/tools -p "test_*.py" -v

  desktop-compilers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python tools/run_compatibility_tests.py
      - shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Sources/tools/StageSources.ps1 -Variant Swing -OutputDirectory Sources/build/ci-swing/src -ResourceOutputDirectory Sources/build/ci-swing/classes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME\bin\javac.exe" -source 1.6 -target 1.6 -d Sources/build/ci-swing/classes '@Sources/build/ci-swing/src/javac.args'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\Sources\SWT\build.bat -source 1.6 -target 1.6
          exit $LASTEXITCODE

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - run: bash ./gradlew :Sources:Android:assembleDebug :Sources:Android:assembleRelease --no-daemon --console=plain

  publication-clearance:
    # Requires the approved first-party license and exact-snapshot clearance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python tools/check_publication.py --release
